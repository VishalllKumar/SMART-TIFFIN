<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Tiffin Cloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
      color:white;
    }

    .container{
      width:100%;
      max-width:1100px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:25px;
    }

    .card{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(15px);
      border-radius:25px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    .title{
      font-size:32px;
      font-weight:700;
      margin-bottom:10px;
      background:linear-gradient(to right,#ff512f,#dd2476);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle{
      color:#cbd5e1;
      margin-bottom:25px;
    }

    .status-box{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:20px;
    }

    .dot{
      width:15px;
      height:15px;
      border-radius:50%;
      background:limegreen;
      box-shadow:0 0 10px limegreen;
    }

    .switch-container{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:25px;
      padding:20px;
      background:rgba(255,255,255,0.05);
      border-radius:18px;
    }

    .switch{
      position:relative;
      width:70px;
      height:35px;
    }

    .switch input{
      display:none;
    }

    .slider{
      position:absolute;
      cursor:pointer;
      inset:0;
      background:#475569;
      border-radius:40px;
      transition:0.4s;
    }

    .slider::before{
      content:'';
      position:absolute;
      width:28px;
      height:28px;
      left:4px;
      top:3.5px;
      background:white;
      border-radius:50%;
      transition:0.4s;
    }

    input:checked + .slider{
      background:linear-gradient(to right,#ff512f,#dd2476);
    }

    input:checked + .slider::before{
      transform:translateX(33px);
    }

    .timer-box{
      margin-top:25px;
    }

    .timer-box h3{
      margin-bottom:15px;
    }

    input[type="number"]{
      width:100%;
      padding:15px;
      border-radius:14px;
      border:none;
      outline:none;
      font-size:18px;
      background:rgba(255,255,255,0.08);
      color:white;
      margin-bottom:20px;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:linear-gradient(to right,#ff512f,#dd2476);
      color:white;
      font-size:17px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.03);
    }

    .countdown{
      text-align:center;
      margin-top:20px;
      font-size:55px;
      font-weight:700;
      letter-spacing:2px;
    }

    .label{
      text-align:center;
      color:#cbd5e1;
      margin-top:10px;
      font-size:18px;
    }

    .stats{
      display:grid;
      grid-template-columns:1fr;
      gap:20px;
      margin-top:25px;
    }

    .mini-card{
      background:rgba(255,255,255,0.05);
      padding:20px;
      border-radius:18px;
      text-align:center;
    }

    .mini-card h2{
      margin-top:10px;
      color:#ff7b54;
    }

    .footer{
      margin-top:20px;
      text-align:center;
      color:#94a3b8;
      font-size:14px;
    }

    @media(max-width:768px){

      .countdown{
        font-size:42px;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <!-- LEFT CARD -->

  <div class="card">

    <div class="title">
      Smart Tiffin
    </div>

    <div class="subtitle">
      IoT Cloud Heating Dashboard
    </div>

    <div class="status-box">
      <div class="dot"></div>
      <span>Firebase Connected</span>
    </div>

    <!-- SWITCH -->

    <div class="switch-container">

      <h3>Power Control</h3>

      <label class="switch">

        <input type="checkbox" id="relaySwitch">

        <span class="slider"></span>

      </label>

    </div>

    <!-- TIMER -->

    <div class="timer-box">

      <h3>Set Timer (Seconds)</h3>

      <input
        type="number"
        id="secondsInput"
        placeholder="Enter seconds"
        min="1"
      >

      <button onclick="startTimer()">
        Start Heating
      </button>

    </div>

    <div class="footer">
      Smart Tiffin Cloud System
    </div>

  </div>

  <!-- RIGHT CARD -->

  <div class="card">

    <div class="title">
      Live Status
    </div>

    <div class="subtitle">
      Realtime Cloud Monitoring
    </div>

    <div class="countdown" id="countdown">
      00:00:00
    </div>

    <div class="label">
      Remaining Time
    </div>

    <div class="stats">

      <div class="mini-card">
        <p>Heater Status</p>
        <h2 id="heaterStatus">OFF</h2>
      </div>

      <div class="mini-card">
        <p>Internet Status</p>
        <h2>ONLINE</h2>
      </div>

    </div>

  </div>

</div>

<script>

  // =========================================
  // FIREBASE CONFIG
  // =========================================

  const firebaseConfig = {

    apiKey: "AIzaSyAMRlQOQDmjlTzfC0taIHnmiZVNIfI_Ln0",

    authDomain: "smarttiffinesp32.firebaseapp.com",

    databaseURL: "https://smarttiffinesp32-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "smarttiffinesp32",

    storageBucket: "smarttiffinesp32.firebasestorage.app",

    messagingSenderId: "131151782027",

    appId: "1:131151782027:web:dd91dab416525a5f77348e"

  };

  firebase.initializeApp(firebaseConfig);

  const db = firebase.database();

  // =========================================
  // VARIABLES
  // =========================================

  let countdownInterval;

  let totalSeconds = 0;

  const relaySwitch = document.getElementById('relaySwitch');

  const heaterStatus = document.getElementById('heaterStatus');

  // =========================================
  // RELAY SWITCH CONTROL
  // =========================================

  relaySwitch.addEventListener('change', () => {

    if(relaySwitch.checked){

      heaterStatus.innerText = 'ON';

      db.ref("relay").set(1);

    }
    else{

      heaterStatus.innerText = 'OFF';

      db.ref("relay").set(0);

    }

  });

  // =========================================
  // START TIMER
  // =========================================

  function startTimer(){

    const inputSeconds = parseInt(

      document.getElementById('secondsInput').value

    );

    if(isNaN(inputSeconds) || inputSeconds <= 0){

      alert("Enter valid seconds");

      return;

    }

    totalSeconds = inputSeconds;

    // SEND TIMER

    db.ref("timer").set(totalSeconds);

    // TURN ON RELAY

    relaySwitch.checked = true;

    heaterStatus.innerText = 'ON';

    db.ref("relay").set(1);

    clearInterval(countdownInterval);

    updateCountdownDisplay();

    countdownInterval = setInterval(() => {

      totalSeconds--;

      updateCountdownDisplay();

      if(totalSeconds <= 0){

        clearInterval(countdownInterval);

        relaySwitch.checked = false;

        heaterStatus.innerText = 'OFF';

        db.ref("relay").set(0);

        document.getElementById('countdown').innerText = '00:00:00';

        alert("🍱 Food is Ready!");

      }

    },1000);

  }

  // =========================================
  // UPDATE COUNTDOWN
  // =========================================

  function updateCountdownDisplay(){

    const hours = Math.floor(totalSeconds / 3600);

    const minutes = Math.floor((totalSeconds % 3600) / 60);

    const seconds = totalSeconds % 60;

    document.getElementById('countdown').innerText =

    `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;

  }

  // =========================================
  // REALTIME STATUS SYNC
  // =========================================

  db.ref("relay").on("value",(snapshot)=>{

    const value = snapshot.val();

    if(value == 1){

      relaySwitch.checked = true;

      heaterStatus.innerText = 'ON';

    }
    else{

      relaySwitch.checked = false;

      heaterStatus.innerText = 'OFF';

    }

  });

</script>

</body>

</html>
